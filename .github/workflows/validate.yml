name: validate

on:
  pull_request:
    paths: ["contracts/**", "data/**", "tools/**", "web/**", "crates/**", "tests/**", "package.json", "pnpm-lock.yaml", "rust-toolchain.toml", "playwright.config.ts", ".github/workflows/validate.yml"]
  push:
    branches: [main]
    paths: ["contracts/**", "data/**", "tools/**", "web/**", "crates/**", "tests/**", "package.json", "pnpm-lock.yaml", "rust-toolchain.toml", "playwright.config.ts"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup toolchain install 1.96.1 --profile minimal --target wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            crates/graph-core/target
          key: ${{ runner.os }}-wasm-1.96.1-0.2.126-${{ hashFiles('crates/graph-core/Cargo.lock') }}
      - run: cargo install wasm-bindgen-cli --version 0.2.126 --locked
      - run: pnpm build
      - run: pnpm -C tools exec tsc --noEmit -p tsconfig.build.json
      - run: pnpm -C web exec tsc --noEmit -p tsconfig.json
      - run: cargo fmt --manifest-path crates/graph-core/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path crates/graph-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path crates/graph-core/Cargo.toml
      - run: pnpm test:unit
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm build:web && pnpm build:offline && pnpm test:browser
        env:
          PUBLIC_BASE_PATH: /HorizonGraph/
          HG_TEST_BASE: /HorizonGraph/
          PUBLIC_ENGINE_BACKEND: wasm
