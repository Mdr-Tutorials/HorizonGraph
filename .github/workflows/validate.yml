name: validate

on:
  pull_request:
    paths: ["contracts/**", "data/**", "tools/**", ".github/workflows/validate.yml"]
  push:
    branches: [main]
    paths: ["contracts/**", "data/**", "tools/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm gen
      - run: pnpm validate