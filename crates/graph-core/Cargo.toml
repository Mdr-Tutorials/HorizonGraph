[package]
name = "horizon-graph-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
wasm-bindgen = "=0.2.126"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
